name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            wheel_smoke: false
          - os: ubuntu-latest
            python: "3.12"
            wheel_smoke: true
          - os: windows-latest
            python: "3.12"
            wheel_smoke: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip build pytest .

      - name: Verify skill files are in sync with canonical sources
        run: python sync.py --check

      - name: Verify graduated templates have proof points
        run: python graduation_check.py

      - name: Run test suite
        run: pytest -q

      - name: Smoke test installed wheel
        if: matrix.wheel_smoke
        run: python scripts/smoke_wheel.py --exercise-fallback
