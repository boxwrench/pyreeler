  <!-- HUD corner ticks -->
  <g stroke="#39ff14" stroke-width="2" opacity="0.7" filter="url(#glow)">
    <path d="M24,24 h34 M24,24 v34" fill="none"/>
    <path d="M1176,24 h-34 M1176,24 v34" fill="none"/>
    <path d="M24,316 h34 M24,316 v-34" fill="none"/>
    <path d="M1176,316 h-34 M1176,316 v-34" fill="none"/>
