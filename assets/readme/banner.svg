    <rect x="886.0" y="182" width="14" height="22" fill="#39ff14">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  
  <defs>
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="#39ff14" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="url(#scan)"/>
  <rect width="1200" height="14" fill="#39ff14" opacity="0.06">
    <animate attributeName="y" from="-14" to="340" dur="6s" repeatCount="indefinite"/>
  </rect>
